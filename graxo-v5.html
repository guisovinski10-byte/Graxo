<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Graxo</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080B10;--s1:#0C1018;--s2:#101620;--s3:#141C28;--s4:#1A2436;
  --b1:#1E2E42;--b2:#253648;--b3:#2E4260;
  --gr:#00E87A;--gr2:#00C468;--grs:#00E87A14;
  --or:#FF6B2B;--or2:#FF8C55;--ors:#FF6B2B14;
  --bl:#3B9EFF;--bls:#3B9EFF14;
  --wh:#F0F6FF;--t1:#C8D8EA;--t2:#7A9AB8;--t3:#3D5A75;
  --re:#FF4757;--res:#FF475714;
  --wa:#FFB347;--was:#FFB34714;
  --pu:#9D7FFF;--pus:#9D7FFF14;
  --go:#FFD700;--gos:#FFD70014;
  --fd:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
  --r:18px;--rm:12px;--rs:8px;
}
html,body{height:100%;background:var(--bg);color:var(--wh);font-family:var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
.shell{height:100vh;max-width:430px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:84px}.scr::-webkit-scrollbar{display:none}

/* NAV */
.nav{position:absolute;bottom:0;left:0;right:0;height:68px;background:var(--s1);border-top:1px solid var(--b1);display:flex;align-items:center;z-index:100;padding:0 4px}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:100%;cursor:pointer;border:none;background:none;transition:.2s;position:relative;padding:8px 2px 10px}
.ni-ico{width:22px;height:22px;transition:.2s}
.ni-ico path,.ni-ico circle,.ni-ico rect,.ni-ico line,.ni-ico polyline{stroke:var(--t3);transition:.2s}
.ni.active .ni-ico path,.ni.active .ni-ico circle,.ni.active .ni-ico rect,.ni.active .ni-ico line,.ni.active .ni-ico polyline{stroke:var(--gr)}
.ni-lbl{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--t3);transition:.2s}
.ni.active .ni-lbl{color:var(--gr)}
.ni-pip{position:absolute;top:8px;right:calc(50% - 15px);width:6px;height:6px;background:var(--or);border-radius:50%;border:2px solid var(--bg)}

/* TOPBAR */
.tb{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:50;border-bottom:1px solid var(--b1)}
.tb-t{font-family:var(--fd);font-size:21px;font-weight:800;letter-spacing:-.5px}

/* LOGO */
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-mk{width:34px;height:34px;background:linear-gradient(135deg,var(--or),var(--or2));border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px var(--ors);position:relative}
.logo-mk span{font-family:var(--fd);font-size:18px;font-weight:800;color:#fff}
.logo-mk-pip{position:absolute;bottom:-3px;right:-3px;width:10px;height:10px;background:var(--gr);border-radius:50%;border:2px solid var(--bg)}
.logo-txt{font-family:var(--fd);font-size:19px;font-weight:800;letter-spacing:-.5px}
.logo-txt span{color:var(--or)}

/* PLAN BADGE */
.plan-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:3px 10px;border-radius:100px;letter-spacing:.3px;cursor:pointer}
.pb-s{background:var(--s3);color:var(--t2);border:1px solid var(--b2)}
.pb-p{background:var(--bls);color:var(--bl);border:1px solid #3B9EFF30}
.pb-t{background:linear-gradient(135deg,#FFD70020,#FF6B2B20);color:var(--go);border:1px solid #FFD70030}

/* CARDS */
.crd{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:18px}
.crd+.crd{margin-top:10px}

/* BADGE */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 9px;border-radius:100px}
.bdg-g{background:var(--grs);color:var(--gr);border:1px solid #00E87A22}
.bdg-o{background:var(--ors);color:var(--or);border:1px solid #FF6B2B22}
.bdg-r{background:var(--res);color:var(--re);border:1px solid #FF475722}
.bdg-w{background:var(--was);color:var(--wa);border:1px solid #FFB34722}
.bdg-b{background:var(--bls);color:var(--bl);border:1px solid #3B9EFF22}
.bdg-go{background:var(--gos);color:var(--go);border:1px solid #FFD70022}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--rm);padding:14px 18px;font-size:14px;font-weight:700;font-family:var(--fb);cursor:pointer;transition:.15s;width:100%}
.btn:active{transform:scale(.97)}
.btn-g{background:linear-gradient(135deg,var(--gr),var(--gr2));color:#050D0A;box-shadow:0 4px 18px var(--grs)}
.btn-o{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;box-shadow:0 4px 18px var(--ors)}
.btn-b{background:linear-gradient(135deg,var(--bl),#2580D4);color:#fff}
.btn-go{background:linear-gradient(135deg,#FFD700,#FFA500);color:#1A0F00;font-weight:800}
.btn-s{background:var(--s3);color:var(--wh);border:1px solid var(--b2)}
.btn-d{background:var(--res);color:var(--re);border:1px solid #FF475722}
.btn-sm{padding:10px 14px;font-size:12px;border-radius:var(--rs)}

/* INPUTS */
.fg{margin-bottom:13px}
.fl{font-size:10px;color:var(--t2);margin-bottom:5px;display:block;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.fi,.fs{width:100%;background:var(--s3);border:1px solid var(--b2);border-radius:var(--rm);padding:13px 15px;font-size:14px;color:var(--wh);font-family:var(--fb);outline:none;transition:.2s}
.fi::placeholder{color:var(--t3)}
.fi:focus,.fs:focus{border-color:var(--gr);box-shadow:0 0 0 3px var(--grs)}
.fs option{background:var(--s2)}
.ir{display:flex;gap:8px}.ir .fg{flex:1}

/* SEARCH */
.srch-w{padding:10px 16px;position:sticky;top:54px;z-index:40;background:var(--bg)}
.srch{position:relative}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.srch svg path{stroke:var(--t3)}
.srch-i{width:100%;background:var(--s3);border:1px solid var(--b2);border-radius:14px;padding:13px 14px 13px 46px;font-size:14px;color:var(--wh);font-family:var(--fb);outline:none;transition:.2s}
.srch-i:focus{border-color:var(--gr);box-shadow:0 0 0 3px var(--grs)}
.srch-i::placeholder{color:var(--t3)}

/* LIST */
.li{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--b1);cursor:pointer;transition:.15s}
.li:last-child{border:none;padding-bottom:0}
.li:active{opacity:.7}
.la{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.la svg path,.la svg circle,.la svg rect,.la svg line,.la svg polyline{stroke:currentColor}
.lo{background:var(--ors);color:var(--or)}.lg{background:var(--grs);color:var(--gr)}
.lb{background:var(--bls);color:var(--bl)}.lp{background:var(--pus);color:var(--pu)}
.lw{background:var(--was);color:var(--wa)}.lr{background:var(--res);color:var(--re)}
.lgo{background:var(--gos);color:var(--go)}
.li-i{flex:1;min-width:0}
.li-n{font-size:14px;font-weight:600;color:var(--wh);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:12px;color:var(--t2)}
.li-r{text-align:right;flex-shrink:0}
.li-v{font-size:13px;font-weight:700;color:var(--wh)}

/* MODAL */
.mo{position:absolute;inset:0;background:#000000BB;z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(8px)}
.mo.open{opacity:1;pointer-events:all}
.mb{background:var(--s1);border-radius:26px 26px 0 0;padding:10px 20px 28px;width:100%;max-height:94vh;overflow-y:auto;transform:translateY(20px);transition:.25s cubic-bezier(.4,0,.2,1);border-top:1px solid var(--b2)}
.mo.open .mb{transform:translateY(0)}
.mb::-webkit-scrollbar{display:none}
.mb-h{width:36px;height:4px;background:var(--b3);border-radius:2px;margin:0 auto 16px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mt{font-family:var(--fd);font-size:20px;font-weight:800}
.mc{background:var(--s3);border:1px solid var(--b2);color:var(--t2);width:34px;height:34px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px}

/* SECTION */
.sp{padding:0 16px}
.st{font-size:10px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:1.2px;margin:14px 0 9px;display:flex;align-items:center;gap:8px}
.st::after{content:'';flex:1;height:1px;background:var(--b1)}

/* FAB */
.fab{position:absolute;bottom:82px;right:16px;width:52px;height:52px;background:linear-gradient(135deg,var(--gr),var(--gr2));border:none;border-radius:16px;color:#050D0A;font-size:26px;font-weight:800;cursor:pointer;box-shadow:0 6px 24px var(--grs);z-index:150;display:flex;align-items:center;justify-content:center;transition:.2s}
.fab:active{transform:scale(.92)}

/* STATS */
.sg{display:grid;gap:10px;padding:0 16px 10px}
.sg2{grid-template-columns:1fr 1fr}.sg3{grid-template-columns:repeat(3,1fr)}
.sb{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:15px 13px;position:relative;overflow:hidden}
.sb::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0}
.sb.gr::before{background:linear-gradient(90deg,var(--gr),transparent)}
.sb.or::before{background:linear-gradient(90deg,var(--or),transparent)}
.sb.wa::before{background:linear-gradient(90deg,var(--wa),transparent)}
.sb.re::before{background:linear-gradient(90deg,var(--re),transparent)}
.sb.bl::before{background:linear-gradient(90deg,var(--bl),transparent)}
.sb.go::before{background:linear-gradient(90deg,var(--go),transparent)}
.sl{font-size:10px;color:var(--t2);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.sv{font-family:var(--fd);font-size:1.3rem;font-weight:800;line-height:1;color:var(--wh)}
.ss{font-size:10px;margin-top:4px;color:var(--t3)}

/* CHART */
.chart{display:flex;align-items:flex-end;gap:5px;height:80px;padding:0 2px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.bbar{border-radius:5px 5px 0 0;min-height:4px;width:100%;transition:.5s}
.blbl{font-size:9px;font-weight:700;color:var(--t3)}

/* PROGRESS */
.pg-r{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.pg-l{font-size:11px;color:var(--t2);min-width:60px;font-weight:500}
.pg-b{flex:1;height:6px;background:var(--b1);border-radius:3px;overflow:hidden}
.pg-f{height:6px;border-radius:3px;transition:.4s}
.pg-v{font-size:11px;font-weight:700;min-width:52px;text-align:right}

/* STOCK BAR */
.stbar{height:4px;background:var(--b1);border-radius:2px;margin-top:8px;overflow:hidden}
.stfill{height:4px;border-radius:2px}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--s2);border:1px solid var(--b1);border-radius:100px;padding:6px 13px;font-size:11px;color:var(--t2);cursor:pointer;white-space:nowrap;font-weight:600;transition:.15s}
.chip.active{background:var(--grs);border-color:var(--gr);color:var(--gr)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* DETAIL */
.dh{padding:18px 18px 14px;background:linear-gradient(180deg,var(--s3),var(--bg));border-bottom:1px solid var(--b1)}
.db{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t2);cursor:pointer;margin-bottom:14px;border:none;background:none;padding:0;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.dav{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-family:var(--fd);font-size:22px;font-weight:800}
.dn{font-family:var(--fd);font-size:22px;font-weight:800;margin-bottom:3px;letter-spacing:-.3px}
.ds{font-size:13px;color:var(--t2)}

/* TIMELINE */
.tl-i{display:flex;gap:12px;padding-bottom:14px}
.tl-left{display:flex;flex-direction:column;align-items:center;width:18px}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.tl-line{width:1px;flex:1;background:var(--b1);margin:4px 0}
.tl-c{flex:1}
.tl-date{font-size:10px;color:var(--t3);margin-bottom:2px;font-weight:600}
.tl-text{font-size:13px;color:var(--t1);font-weight:500}

/* CRM ALERT */
.crm-alert{background:linear-gradient(135deg,var(--was),var(--s3));border:1px solid var(--wa);border-radius:var(--r);padding:14px;margin-bottom:12px}
.crm-a-tag{font-size:10px;font-weight:800;color:var(--wa);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}

/* CHECKLIST */
.ck-i{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--b1);cursor:pointer}
.ck-i:last-child{border:none}
.ck-box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--b3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;font-size:12px;color:#050D0A;font-weight:900}
.ck-box.done{background:var(--gr);border-color:var(--gr)}
.ck-txt{font-size:13px;color:var(--t2);font-weight:500}
.ck-txt.done{text-decoration:line-through;opacity:.4}

/* PHOTO GRID */
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ps{background:var(--s3);border:1.5px dashed var(--b2);border-radius:14px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.2s;overflow:hidden}
.ps.done{border-style:solid;border-color:var(--gr);background:linear-gradient(135deg,var(--grs),var(--s3))}
.ps-lbl{font-size:11px;color:var(--t2);font-weight:600}

/* SIGNATURE */
.sig-canvas{width:100%;height:120px;background:var(--s3);border:1px solid var(--b2);border-radius:var(--rm);cursor:crosshair;display:block;touch-action:none}
.sig-canvas.signed{border-color:var(--gr)}

/* PAYWALL */
.pw-lock{display:flex;flex-direction:column;align-items:center;padding:32px 20px;text-align:center;gap:10px}
.pw-icon{font-size:36px;opacity:.5}
.pw-title{font-family:var(--fd);font-size:16px;font-weight:800;color:var(--t2)}
.pw-sub{font-size:12px;color:var(--t3);line-height:1.5}

/* APPROVAL PAGE */
.apv-pg{display:flex;flex-direction:column;min-height:100%;background:var(--bg);padding:20px}
.apv-link{background:var(--s3);border:1px solid var(--gr);border-radius:var(--rm);padding:10px 14px;font-size:11px;color:var(--t2);word-break:break-all;font-family:monospace;margin-top:6px}

/* INADIMPLENCIA */
.inad-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b1);font-size:13px}
.inad-item:last-child{border:none}

/* PLAN CARDS */
.plan-grid{display:flex;flex-direction:column;gap:12px}
.plan-card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);padding:18px;position:relative;transition:.2s}
.plan-card.active-plan{border-color:var(--gr);box-shadow:0 0 24px var(--grs)}
.plan-card.turbo{border-color:var(--go);box-shadow:0 0 20px var(--gos)}
.plan-card.pro{border-color:var(--bl);box-shadow:0 0 20px var(--bls)}
.plan-name{font-family:var(--fd);font-size:18px;font-weight:800;margin-bottom:2px}
.plan-price{font-family:var(--fd);font-size:1.6rem;font-weight:800;margin-bottom:10px}
.plan-price span{font-size:12px;font-weight:400;color:var(--t2)}
.plan-feat{font-size:12px;color:var(--t1);padding:4px 0;display:flex;align-items:center;gap:8px;line-height:1.4}
.plan-feat::before{content:'✓';color:var(--gr);font-weight:900;flex-shrink:0}
.plan-lock{font-size:12px;color:var(--t3);padding:4px 0;display:flex;align-items:center;gap:8px}
.plan-lock::before{content:'🔒';flex-shrink:0;font-size:10px}
.plan-current{position:absolute;top:12px;right:12px;background:var(--grs);color:var(--gr);border:1px solid var(--gr);border-radius:100px;padding:3px 10px;font-size:10px;font-weight:800}
.plan-pop{position:absolute;top:12px;right:12px;background:var(--bls);color:var(--bl);border:1px solid var(--bl);border-radius:100px;padding:3px 10px;font-size:10px;font-weight:800}

/* FINANCIAL HEALTH */
.fh{background:linear-gradient(135deg,var(--s3),var(--s2));border:1px solid var(--b2);border-radius:var(--r);padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.fh::after{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,var(--grs),transparent);pointer-events:none}
.fh-score{font-family:var(--fd);font-size:3rem;font-weight:800;line-height:1;letter-spacing:-2px}

/* QI */
.qi{display:flex;align-items:center;gap:10px;background:var(--s3);border:1px solid var(--b2);border-radius:var(--rm);padding:11px 13px;margin-bottom:8px}
.qi-n{flex:1;font-size:13px;font-weight:600}
.qi-v{font-size:13px;font-weight:700;color:var(--or)}
.qi-rm{background:none;border:none;color:var(--re);cursor:pointer;padding:2px;font-size:18px}

/* PRESETS */
.qa-preset{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qa-tag{background:var(--s3);border:1px solid var(--b2);border-radius:100px;padding:5px 11px;font-size:11px;color:var(--t1);cursor:pointer;font-weight:500;transition:.15s;white-space:nowrap}
.qa-tag:active{border-color:var(--gr);color:var(--gr)}

/* LOGIN */
.login-sc{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);position:relative;overflow:hidden}
.login-glow1{position:absolute;top:-100px;left:-100px;width:350px;height:350px;background:radial-gradient(circle,#FF6B2B0A,transparent 70%);animation:gf 8s ease-in-out infinite;pointer-events:none}
.login-glow2{position:absolute;bottom:0;right:-50px;width:280px;height:280px;background:radial-gradient(circle,#00E87A07,transparent 70%);animation:gf 6s ease-in-out infinite reverse;pointer-events:none}
.login-grid{position:absolute;inset:0;background-image:linear-gradient(var(--b1) 1px,transparent 1px),linear-gradient(90deg,var(--b1) 1px,transparent 1px);background-size:40px 40px;opacity:.25;mask-image:radial-gradient(ellipse at 50% 40%,black 20%,transparent 75%);pointer-events:none}

.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999}
.loading-spin{width:40px;height:40px;border:3px solid var(--b2);border-top-color:var(--gr);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--t2);font-weight:500}

@keyframes gf{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.login-body{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;min-height:100vh;padding:2.5rem 1.75rem;gap:2rem}
.login-top{display:flex;flex-direction:column;align-items:center;gap:14px}
.login-ico{width:76px;height:76px;background:linear-gradient(135deg,var(--or),var(--or2));border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 48px var(--ors);position:relative}
.login-ico span{font-family:var(--fd);font-size:36px;font-weight:800;color:#fff;letter-spacing:-1px}
.login-ico-pip{position:absolute;bottom:-4px;right:-4px;width:18px;height:18px;background:var(--gr);border-radius:50%;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:8px;color:#050D0A;font-weight:900;box-shadow:0 0 12px var(--gr)}
.login-brand{font-family:var(--fd);font-size:2.4rem;font-weight:800;letter-spacing:-1.5px}
.login-brand span{color:var(--or)}
.login-sub{font-size:13px;color:var(--t2);text-align:center;line-height:1.5;max-width:260px}
.login-proof{display:flex;align-items:center;justify-content:center;gap:10px}
.login-avs{display:flex}

function bDetail(){
  const t=S.detail.type,id=S.detail.id;
  if(t==='cliente')return bDCliente(id);
  if(t==='orc')return bDOrc(id);
  if(t==='os')return bDOS(id);
  if(t==='agend')return bDAgend(id);
  if(t==='estoque')return bDEstoque(id);
  if(t==='mec')return bDMec(id);
  return'';
}

// SIGNATURE DRAWING
document.addEventListener('click',function(){
  setTimeout(()=>{
    document.querySelectorAll('.sig-canvas').forEach(canvas=>{
      if(canvas._bound)return;canvas._bound=true;
      const ctx=canvas.getContext('2d');
      let drawing=false,lx=0,ly=0;
      ctx.strokeStyle='#00E87A';ctx.lineWidth=2;ctx.lineCap='round';
      function getPos(e){const r=canvas.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(canvas.width/r.width),y:(src.clientY-r.top)*(canvas.height/r.height)};}
      canvas.addEventListener('mousedown',e=>{drawing=true;const p=getPos(e);lx=p.x;ly=p.y;});
      canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;});
      canvas.addEventListener('mouseup',()=>drawing=false);
      canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=getPos(e);lx=p.x;ly=p.y;},{passive:false});
      canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;},{passive:false});
      canvas.addEventListener('touchend',()=>drawing=false);
    });
  },100);
});

async function doSignUp() {
  const nameEl = document.getElementById('su-name');
  const emailEl = document.getElementById('su-email');
  const passEl = document.getElementById('su-pass');
  if (!nameEl || !emailEl || !passEl) return;

  if (btn) { btn.textContent = 'Criando...'; btn.disabled = true; }

    // ── DATA LOADERS ───────────────────────────────────────────────────
    async function loadAllData() {
      try {
        const [cliR, mecR, orcR, osR, finR] = await Promise.allSettled([
          _sb.from('clientes').select('*').order('created_at', {ascending:false}),
          _sb.from('usuarios').select('*').order('nome'),
          _sb.from('orcamentos').select('*').order('created_at', {ascending:false}),
          _sb.from('ordens_servico').select('*').order('created_at', {ascending:false}),
          _sb.from('financeiro').select('*').order('data', {ascending:false}),
        ]);

        if (cliR.status==='fulfilled' && cliR.value.data?.length) {
          S.clientes = cliR.value.data.map(d => ({
            id: d.id,
            nome: d.nome || '',
            tel: d.telefone || '',
            placa: d.placa || '',
            modelo: d.veiculo || d.modelo || '',
            cor: d.cor || '',
            km: d.km || 0
          }));
        }
        if (mecR.status==='fulfilled' && mecR.value.data?.length) {
          S.mecanicos = mecR.value.data.map(d => ({
            id: d.id,
            nome: d.nome || '',
            cargo: d.cargo || 'Mecânico',
            tel: d.telefone || '',
            ativo: d.ativo !== false
          }));
        }
        if (orcR.status==='fulfilled' && orcR.value.data?.length) {
          S.orcamentos = orcR.value.data.map(d => {
            let svs = [];
            try { svs = typeof d.itens === 'string' ? JSON.parse(d.itens) : (d.itens || []); } catch(e) {}
            return {
              id: d.id,
              clienteId: d.cliente_id,
              servicos: svs,
              status: d.status || 'pendente',
              data: fmtDate(d.created_at),
              pago: d.pago || false
            };
          });
        }
        if (osR.status==='fulfilled' && osR.value.data?.length) {
          S.os = osR.value.data.map(d => {
            let ck = [];
            try { ck = typeof d.checklist==='string' ? JSON.parse(d.checklist) : (d.checklist||[]); } catch(e){}
            return {
              id: d.id,
              clienteId: d.cliente_id,
              orcId: d.orcamento_id,
              mecanico: d.mecanico_id,
              status: d.status || 'em_andamento',
              inicio: fmtDate(d.created_at),
              fim: d.concluido_em ? fmtDate(d.concluido_em) : null,
              obs: d.observacoes || '',
              km: d.km_entrada || 0,
              fotos: d.fotos || ['','','',''],
              checklist: ck.length ? ck : [false,false,false,false,false],
              assinatura: d.assinatura || false
            };
          });
        }
        if (finR.status==='fulfilled' && finR.value.data?.length) {
          S.financeiro = finR.value.data.map(d => ({
            id: d.id,
            tipo: d.tipo || 'receita',
            desc: d.descricao || '',
            valor: parseFloat(d.valor) || 0,
            data: fmtDate(d.data || d.created_at),
            pago: d.pago || false
          }));
        }
      } catch(e) {
        console.warn('loadAllData error:', e);
      }
    }

    function fmtDate(s) {
      if (!s) return hoje();
      try {
        const d = new Date(s);
        if (isNaN(d)) return hoje();
        return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
      } catch(e) { return hoje(); }
    }

    // ── DB SAVE HELPERS ────────────────────────────────────────────────
    async function dbSave(table, row) {
      const { data, error } = await _sb.from(table).insert(row).select().single();
      if (error) console.error('DB save error:', table, error.message);
      return data;
    }
    async function dbUpdate(table, id, row) {
      const { error } = await _sb.from(table).update(row).eq('id', id);
      if (error) console.error('DB update error:', table, error.message);
    }
    async function dbDelete(table, id) {
      const { error } = await _sb.from(table).delete().eq('id', id);
      if (error) console.error('DB delete error:', table, error.message);
    }

    // ── SESSION RESTORE ────────────────────────────────────────────────
    _sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        S.user = session.user;
        S.logged = true;
        await loadAllData();
        r();
      } else if (event === 'SIGNED_OUT') {
        S.logged = false;
        S.user = null;
        r();
      }
    });

      if (session?.user) {
        S.user = session.user;
        S.logged = true;
        await loadAllData();
        r();
      }
    })();
